name: release-mac
on:
  push:
    tags: ['v*-mac', 'v*']
  pull_request:
    branches: [feat/macos-port, main]
  workflow_dispatch:

# Cancel in-flight runs of the same workflow for the same ref so
# accidental dupes don't burn runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15 # apple silicon runner
    timeout-minutes: 90
    permissions:
      contents: write # softprops/action-gh-release needs to create releases

    steps:
      - name: checkout noobs
        uses: actions/checkout@v4

      # actions/cache only handles paths inside the workspace. Clone
      # obs-studio and ffmpeg inside ./vendor/ rather than the script's default
      # `../obs-studio` and pass the location via OBS_ROOT.
      - name: cache obs-studio + build
        uses: actions/cache@v4
        with:
          path: |
            vendor/obs-studio
            vendor/ffmpeg
          key: obs-studio-${{ hashFiles('scripts/build-libobs-mac.sh', 'scripts/obs-patches/*') }}

      # OBS 31.1 requires Xcode 16+ and the macOS 15 SDK.
      - name: select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: install build deps
        run: |
          brew install cmake jq ccache pkg-config
          sudo xcodebuild -license accept || true

      - name: build libobs + plugins (vendor into Frameworks/PlugIns)
        env:
          OBS_ROOT: ${{ github.workspace }}/vendor/obs-studio
          FFMPEG_ROOT: ${{ github.workspace }}/vendor/ffmpeg
        run: |
          mkdir -p vendor
          chmod +x scripts/build-libobs-mac.sh
          ./scripts/build-libobs-mac.sh

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install npm deps
        run: npm install

      - name: build noobs.node + dist
        run: npm run build

      - name: pack tarball
        run: npm pack

      - name: rename tarball with platform/arch
        id: pack
        run: |
          ORIG=$(ls noobs-*.tgz | head -1)
          NEW="noobs-darwin-arm64-${ORIG#noobs-}"
          mv "$ORIG" "$NEW"
          echo "tarball=$NEW" >> $GITHUB_OUTPUT

      - name: upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: noobs-darwin-arm64
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

      # Tag-triggered runs publish the tarball on a GitHub Release so
      # wow-recorder can `npm install` it via a pinned URL without
      # stepping through manual artifact downloads.
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball }}
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
